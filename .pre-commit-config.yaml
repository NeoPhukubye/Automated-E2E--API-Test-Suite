repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies: [types-requests, pytest, allure-pytest, playwright, faker, pydantic, pydantic-settings, python-dotenv]
        args: [--strict, --ignore-missing-imports]

  - repo: https://github.com/pycqa/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        args: [--convention=google]

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        additional_dependencies: [flake8-docstrings, flake8-bugbear, flake8-comprehensions]
        args: [--max-line-length=120]

  - repo: local
    hooks:
      - id: pip-audit
        name: pip-audit
        entry: pip-audit
        language: system
        types: [python]
        args: [--desc, --fix]
        pass_filenames: false

  - repo: local
    hooks:
      - id: pytest-check
        name: pytest quick check
        entry: pytest
        language: system
        types: [python]
        args: [--collect-only, -q]
        pass_filenames: false
        stages: [pre-commit, pre-push]

default_language_version:
  python: python3