name: Test Suite CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BASE_URL: https://fakestoreapi.com
  UI_BASE_URL: https://fakestoreapi.com
  HEADLESS: "true"

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run API tests
        run: python -m pytest tests/api/ -v --tb=short

  e2e-tests:
    runs-on: ubuntu-latest
    if: ${{ hashFiles('tests/e2e/test_*.py') != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run E2E tests
        run: python -m pytest tests/e2e/ -v --tb=short
