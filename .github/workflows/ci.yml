name: Test Suite CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BASE_URL: https://fakestoreapi.com
  UI_BASE_URL: https://fakestoreapi.com
  HEADLESS: "true"

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify test collection
        run: python -m pytest tests/api/ --collect-only -p no:playwright

      - name: Run API tests
        run: python -m pytest tests/api/ -v --tb=long -p no:playwright

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for E2E tests
        id: check
        run: |
          count=$(find tests/e2e -name 'test_*.py' 2>/dev/null | wc -l)
          if [ "$count" -gt 0 ]; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "No E2E tests found, skipping."
          fi

      - name: Set up Python
        if: steps.check.outputs.has_tests == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        if: steps.check.outputs.has_tests == 'true'
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run E2E tests
        if: steps.check.outputs.has_tests == 'true'
        run: python -m pytest tests/e2e/ -v --tb=short
