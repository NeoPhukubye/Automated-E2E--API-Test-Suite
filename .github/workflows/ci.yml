name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  BASE_URL: https://fakestoreapi.com
  UI_BASE_URL: https://www.saucedemo.com
  HEADLESS: true
  BROWSER: chromium
  TIMEOUT: 30
  RETRIES: 3
  VIEWPORT_WIDTH: 1280
  VIEWPORT_HEIGHT: 720
  SLOW_MO: 0
  API_TIMEOUT: 30
  VERIFY_SSL: true
  MOCK_API: false

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Run Ruff linting
        run: ruff check .

      - name: Run Ruff formatting check
        run: ruff format --check .

      - name: Run MyPy type checking
        run: mypy --strict .

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API tests
        run: |
          pytest tests/api/ -v --tb=short --durations=10 -m "api" \
            --junitxml=reports/api-junit.xml \
            --html=reports/api-report.html --self-contained-html

      - name: Upload API test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-report-${{ matrix.python-version }}
          path: reports/api-report.html
          retention-days: 7

      - name: Upload API JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-junit-${{ matrix.python-version }}
          path: reports/api-junit.xml
          retention-days: 7

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Run E2E tests
        run: |
          pytest tests/e2e/ -v --tb=short --durations=10 -m "e2e" \
            --junitxml=reports/e2e-junit.xml \
            --html=reports/e2e-report.html --self-contained-html

      - name: Upload E2E test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: reports/e2e-report.html
          retention-days: 7

      - name: Upload E2E JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-junit
          path: reports/e2e-junit.xml
          retention-days: 7

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: reports/screenshots/
          retention-days: 7

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          pytest --cov=utils --cov=pages --cov=config \
            --cov-report=term-missing \
            --cov-report=html:reports/coverage-html \
            --cov-report=xml:reports/coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: reports/coverage-html/
          retention-days: 7

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: reports/coverage.xml
          retention-days: 7