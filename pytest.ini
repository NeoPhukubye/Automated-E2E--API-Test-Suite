[pytest]
testpaths = tests
asyncio_mode = auto
pythonpath = .
minversion = 7.0

markers =
    api: API tests (no browser required)
    e2e: End-to-end UI tests (requires Playwright)
    smoke: Smoke tests (quick sanity checks for CI gating)
    regression: Full regression suite
    integration: Integration/workflow tests spanning multiple endpoints
    performance: Performance and load tests
    external: Tests that require network access to external services
    slow: Slow running tests (>5s)
    serial: Tests that must run serially (not in parallel)

addopts = -v --strict-markers --tb=short --strict-config --durations=10

filterwarnings =
    ignore::urllib3.exceptions.DependencyWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::pytest.PytestReturnNotNoneWarning

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s - %(name)s - %(levelname)s - %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

norecursedirs =
    .git
    .tox
    dist
    build
    *.egg-info
    reports
    allure-results
    .pytest_cache
    venv
    .venv
    __pycache__
    .mypy_cache
    .ruff_cache

junit_family = xunit2
junit_logging = system-out
junit_duration_report = all

console_output_style = classic

asyncio_default_fixture_loop_scope = function

# Retry settings (requires pytest-rerunfailures)
reruns = 3
reruns_delay = 2

# Parallel execution (requires pytest-xdist)
# numprocesses = auto
