[pytest]
testpaths = tests
asyncio_mode = auto
markers =
    api: API tests
    e2e: End-to-end UI tests
    smoke: Smoke tests (quick sanity checks)
    regression: Full regression suite
    integration: Integration/workflow tests spanning multiple endpoints
    performance: Performance and load tests
addopts = -v --strict-markers --tb=short
filterwarnings =
    ignore::urllib3.exceptions.DependencyWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s - %(name)s - %(levelname)s - %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
norecursedirs = .git .tox dist build *.egg-info reports allure-results .pytest_cache
junit_family = xunit2
junit_logging = system-out
junit_log_passing_snapshots = true